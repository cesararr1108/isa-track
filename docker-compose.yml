# Servicios de apoyo para desarrollo local: PostgreSQL (con PostGIS) y Redis.
# Uso: docker compose up -d   (luego: php artisan migrate --seed && php artisan serve)
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: isa_track
      POSTGRES_USER: isa
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
