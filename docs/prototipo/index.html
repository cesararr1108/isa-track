<title>ISA Track Medellín</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: menú lateral azul profundo con las secciones del sistema; a la derecha la vista activa (listas + mapas Leaflet). En celular el menú se abre desde la barra superior. */
:root {
  --navy: #0B1F3A;          /* azul profundo: menú, encabezados */
  --mint: #00C896;          /* verde menta: botones, confirmaciones, "en camino" */
  --amber: #FFB800;         /* ámbar: alertas suaves, tarifas, puntos de interés */
  --bg: #F2F5F9;
  --surface: #FFFFFF;
  --sunken: #E9EEF5;
  --line: #D5DEE9;
  --fg: #0B1F3A;
  --muted: #55667E;
  --side-bg: #0B1F3A; --side-fg: #C3D1E4; --side-muted: #7F93AF; --side-hover: #142C4D;
  --accent: #00C896; --accent-ink: #062018; --accent-soft: #D6F5EC; --accent-text: #00805F;
  --amber-ink: #3A2A00; --amber-soft: #FFF1C7; --amber-text: #8A6200;
  --danger: #D92D20;
  --s-created: #64748B; --s-prepared: #6366F1; --s-assigned: #0EA5E9; --s-in_route: #00C896;
  --s-delivered: #16A34A; --s-incident: #FFB800; --s-returned: #D92D20;
  --map-bg: #E4EBF2; --map-river: #6FA9D6;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #06111F; --surface: #0D1D33; --sunken: #0A182A; --line: #1D324F; --fg: #EAF1FA; --muted: #93A6C1;
    --side-bg: #040C17; --side-fg: #C3D1E4; --side-muted: #6E84A3; --side-hover: #0E2240;
    --accent-ink: #04140F; --accent-soft: #0B3A2F; --accent-text: #3EE0B5;
    --amber-ink: #241A00; --amber-soft: #3A2C05; --amber-text: #FFCB47; --danger: #F97066;
    --map-bg: #0B1A2C; --map-river: #2D5E86;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #06111F; --surface: #0D1D33; --sunken: #0A182A; --line: #1D324F; --fg: #EAF1FA; --muted: #93A6C1;
  --side-bg: #040C17; --side-fg: #C3D1E4; --side-muted: #6E84A3; --side-hover: #0E2240;
  --accent-ink: #04140F; --accent-soft: #0B3A2F; --accent-text: #3EE0B5;
  --amber-ink: #241A00; --amber-soft: #3A2C05; --amber-text: #FFCB47; --danger: #F97066;
  --map-bg: #0B1A2C; --map-river: #2D5E86;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--display); letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
.mono { font-family: var(--mono); font-size: .85em; letter-spacing: .02em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }

/* ---------- esqueleto: menú + contenido ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--side-bg); }
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--side-bg); color: var(--side-fg); position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); overflow-y: auto; display: flex; flex-direction: column; padding: 18px 12px 18px max(12px, env(safe-area-inset-left, 0px)); gap: 18px; z-index: 40; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; color: #fff; }
.brand b { font-family: var(--display); font-size: 1.25rem; letter-spacing: -.01em; }
.brand small { display: block; color: var(--side-muted); font-size: .74rem; }
.nav { display: grid; gap: 14px; }
.nav p { margin: 0 0 4px; padding: 0 10px; font-size: .68rem; text-transform: uppercase; letter-spacing: .1em; color: var(--side-muted); font-weight: 700; }
.nav ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.nav button { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; background: none; color: var(--side-fg); padding: 8px 10px; border-radius: 8px; cursor: pointer; text-align: left; font-weight: 600; font-size: .92rem; position: relative; }
.nav button svg { flex: none; opacity: .85; }
.nav button:hover { background: var(--side-hover); color: #fff; }
.nav button[aria-current="page"] { background: var(--side-hover); color: #fff; }
.nav button[aria-current="page"]::before { content: ""; position: absolute; left: -12px; top: 6px; bottom: 6px; width: 4px; border-radius: 0 4px 4px 0; background: var(--mint); }
.nav .badge { margin-left: auto; background: var(--amber); color: #3A2A00; border-radius: 999px; font-size: .7rem; padding: 0 7px; font-weight: 800; }
.side .foot { margin-top: auto; font-size: .75rem; color: var(--side-muted); padding: 0 10px; display: grid; gap: 8px; }
.side .foot button { background: none; border: 1px solid var(--side-hover); color: var(--side-fg); border-radius: 8px; padding: 6px 10px; cursor: pointer; }

.content { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .in { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.top h1 { font-size: 1.3rem; }
.top .spacer { flex: 1; }
.menu-btn { display: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-weight: 700; }
.who { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); }
.who select { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); max-width: 230px; }
main { padding: 18px max(16px, env(safe-area-inset-right, 0px)) 56px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 16px; align-content: start; }
.intro { margin: 0; color: var(--muted); max-width: 75ch; }

/* ---------- piezas ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.panel > header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel > header h3 { font-size: 1rem; }
.pad { padding: 14px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.grid-l { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 16px; align-items: start; }
.stack { display: grid; gap: 12px; min-width: 0; }
.row-wrap { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 8px; border-radius: 999px; font-size: .76rem; font-weight: 700; white-space: nowrap;
  background: color-mix(in srgb, var(--c) 16%, transparent); color: color-mix(in srgb, var(--c) 60%, var(--fg)); }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.fee { display: inline-block; font-weight: 800; font-size: .8rem; padding: 1px 8px; border-radius: 6px; background: var(--amber); color: #3A2A00; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cod { font-size: .74rem; font-weight: 700; color: var(--amber-text); border: 1px solid color-mix(in srgb, var(--amber) 55%, transparent); border-radius: 6px; padding: 0 6px; white-space: nowrap; }
.plate { display: inline-block; font-family: var(--mono); font-weight: 600; font-size: .78rem; letter-spacing: .08em; background: var(--amber); color: #3A2A00; padding: 1px 7px; border-radius: 5px; border: 1px solid #C98F00; }
.chip { display: inline-block; font-size: .72rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--sunken); color: var(--muted); }
.chip.ok { background: var(--accent-soft); color: var(--accent-text); }
.chip.warn { background: var(--amber-soft); color: var(--amber-text); }
.chip.bad { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
.btn { border: 0; background: var(--accent); color: var(--accent-ink); padding: 9px 16px; border-radius: 9px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.btn:hover { filter: brightness(1.05); }
.btn.secondary { background: var(--sunken); color: var(--fg); border: 1px solid var(--line); }
.btn.navy { background: var(--navy); color: #fff; }
.btn.warn { background: var(--amber); color: #3A2A00; }
.btn.danger { background: var(--danger); color: #fff; }
.btn.small { padding: 5px 10px; font-size: .82rem; border-radius: 7px; }
.btn.big { width: 100%; padding: 15px; font-size: 1.05rem; border-radius: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.link { background: none; border: 0; color: var(--accent-text); font-weight: 700; cursor: pointer; padding: 2px 0; }
.empty { padding: 22px 14px; color: var(--muted); text-align: center; margin: 0; }
.section-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 700; margin: 0 0 6px; }
dl.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 14px; margin: 0; font-size: .9rem; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; overflow-wrap: anywhere; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 2px; }
.kpi span { color: var(--muted); font-size: .8rem; font-weight: 600; }
.kpi b { font-family: var(--display); font-size: 1.6rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpi small { color: var(--muted); font-size: .75rem; }
.kpi.mint { border-top: 3px solid var(--mint); }
.kpi.amber { border-top: 3px solid var(--amber); }
.kpi.navy { background: var(--navy); color: #fff; border-color: var(--navy); }
.kpi.navy span, .kpi.navy small { color: #B5C5DB; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.fbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px 5px 10px; cursor: pointer; display: flex; gap: 8px; align-items: center; font-size: .84rem; }
.fbtn[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }

/* listas */
.rows { list-style: none; margin: 0; padding: 0; }
.rows > li { border-bottom: 1px solid var(--line); }
.rows > li:last-child { border-bottom: 0; }
.row { width: 100%; text-align: left; background: none; border: 0; padding: 11px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; cursor: pointer; }
.row:hover { background: var(--sunken); }
.row[aria-current="true"] { background: var(--accent-soft); }
.row .name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.row .meta { color: var(--muted); font-size: .8rem; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.row .right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { position: relative; padding: 0 0 14px 22px; border-left: 2px solid var(--line); margin-left: 6px; font-size: .88rem; }
.timeline li:last-child { border-left-color: transparent; padding-bottom: 0; }
.timeline li::before { content: ""; position: absolute; left: -7px; top: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--c); border: 2px solid var(--surface); }
.timeline strong { display: block; }
.timeline small { color: var(--muted); }
.evidence { display: flex; gap: 10px; flex-wrap: wrap; }
.evidence img { width: 120px; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.actions select { padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); max-width: 100%; }

/* formularios */
form.grid, .fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; padding: 14px; }
.full { grid-column: 1 / -1; }
label.f { display: grid; gap: 4px; font-size: .78rem; color: var(--muted); font-weight: 700; min-width: 0; }
label.f input, label.f select, label.f textarea { padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: .95rem; color: var(--fg); font-weight: 400; min-width: 0; width: 100%; }
label.f input[type="color"] { padding: 2px; height: 40px; }
.hint { font-size: .78rem; color: var(--muted); font-weight: 500; }
.check { display: flex; gap: 8px; align-items: center; font-size: .9rem; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--mint); }

/* mapa */
.map { height: 420px; border-radius: 0 0 var(--radius) var(--radius); background: var(--map-bg); position: relative; z-index: 0; }
.map.tall { height: 560px; }
.map.short { height: 260px; border-radius: 12px; }
.map-note { padding: 8px 14px 12px; font-size: .76rem; color: var(--muted); display: flex; gap: 6px 14px; flex-wrap: wrap; }
.mk { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--c, var(--navy)); color: #fff; font: 800 12px/1 var(--body); border: 3px solid var(--surface); box-shadow: 0 2px 6px rgb(0 0 0 / .3); }
.mk.dot { width: 18px; height: 18px; }
.mk.rider { border-radius: 8px; background: var(--navy); border-color: var(--mint); width: 30px; height: 30px; font-size: 11px; }
.mk.depot { border-radius: 6px; background: var(--amber); color: #3A2A00; }
.mk.dark { color: #0B1F3A; }
.blabel { font: 600 11px/1 var(--body); color: var(--muted); white-space: nowrap; text-shadow: 0 0 3px var(--map-bg), 0 0 3px var(--map-bg); }
.zlabel { font: 700 11px/1.2 var(--body); white-space: nowrap; text-align: center; color: var(--fg); text-shadow: 0 0 3px var(--surface), 0 0 3px var(--surface); }
.river { stroke: var(--map-river); }
.route-line { stroke: var(--navy); }
:root:not([data-theme="light"]) .route-line { stroke: var(--navy); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .route-line { stroke: var(--mint); } }
:root[data-theme="dark"] .route-line { stroke: var(--mint); }
.draw-line { stroke: var(--amber); }

/* Leaflet: estilos mínimos (la hoja de estilos oficial no se puede cargar desde la CDN) */
.leaflet-pane, .leaflet-tile, .leaflet-marker-icon, .leaflet-marker-shadow, .leaflet-tile-container, .leaflet-pane > svg, .leaflet-pane > canvas, .leaflet-zoom-box, .leaflet-image-layer, .leaflet-layer { position: absolute; left: 0; top: 0; }
.leaflet-container { overflow: hidden; -webkit-tap-highlight-color: transparent; font-family: var(--body); outline-offset: 1px; }
.leaflet-tile, .leaflet-marker-icon, .leaflet-marker-shadow { user-select: none; -webkit-user-drag: none; }
.leaflet-tile { visibility: hidden; }
.map-off { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 1000; max-width: calc(100% - 24px); background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-left: 4px solid var(--amber); border-radius: 8px; padding: 6px 10px; font-size: .76rem; box-shadow: 0 2px 8px rgb(0 0 0 / .15); }
.leaflet-tile-loaded { visibility: inherit; }
.leaflet-container img.leaflet-tile, .leaflet-container .leaflet-marker-icon, .leaflet-container .leaflet-overlay-pane svg { max-width: none !important; max-height: none !important; }
.leaflet-container img.leaflet-tile { width: 256px; height: 256px; }
.leaflet-pane { z-index: 400; } .leaflet-tile-pane { z-index: 200; } .leaflet-overlay-pane { z-index: 400; } .leaflet-shadow-pane { z-index: 500; }
.leaflet-marker-pane { z-index: 600; } .leaflet-tooltip-pane { z-index: 650; } .leaflet-popup-pane { z-index: 700; }
.leaflet-map-pane svg { z-index: 200; }
.leaflet-control { position: relative; z-index: 800; pointer-events: auto; float: left; clear: both; }
.leaflet-top, .leaflet-bottom { position: absolute; z-index: 1000; pointer-events: none; }
.leaflet-top { top: 0; } .leaflet-right { right: 0; } .leaflet-bottom { bottom: 0; } .leaflet-left { left: 0; }
.leaflet-right .leaflet-control { float: right; margin-right: 10px; } .leaflet-left .leaflet-control { margin-left: 10px; }
.leaflet-top .leaflet-control { margin-top: 10px; } .leaflet-bottom .leaflet-control { margin-bottom: 0; }
.leaflet-zoom-animated { transform-origin: 0 0; }
.leaflet-zoom-anim .leaflet-zoom-animated { transition: transform .25s cubic-bezier(0, 0, .25, 1); }
.leaflet-zoom-anim .leaflet-tile, .leaflet-pan-anim .leaflet-tile { transition: none; }
.leaflet-interactive { cursor: pointer; }
.leaflet-grab { cursor: grab; } .leaflet-dragging .leaflet-grab { cursor: grabbing; }
.leaflet-crosshair, .leaflet-crosshair .leaflet-interactive { cursor: crosshair; }
.leaflet-marker-icon.pin-icon { background: none; border: 0; }
.leaflet-bar { border-radius: 8px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 1px 4px rgb(0 0 0 / .15); }
.leaflet-bar a { display: block; width: 30px; height: 30px; text-align: center; background: var(--surface); color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--line); font: 700 18px/30px var(--body); }
.leaflet-bar a:last-child { border-bottom: 0; }
.leaflet-control-attribution { background: color-mix(in srgb, var(--surface) 80%, transparent); font-size: 10px; padding: 0 6px; color: var(--muted); }
.leaflet-control-attribution a { color: var(--muted); }
.leaflet-popup { position: absolute; text-align: center; margin-bottom: 20px; }
.leaflet-popup-content-wrapper { padding: 1px; text-align: left; border-radius: 10px; background: var(--surface); color: var(--fg); box-shadow: 0 6px 20px rgb(0 0 0 / .25); border: 1px solid var(--line); }
.leaflet-popup-content { margin: 10px 14px; line-height: 1.4; font-size: 13px; min-width: 160px; }
.leaflet-popup-tip-container { width: 40px; height: 20px; position: absolute; left: 50%; margin-top: -1px; margin-left: -20px; overflow: hidden; pointer-events: none; }
.leaflet-popup-tip { width: 17px; height: 17px; padding: 1px; margin: -10px auto 0; transform: rotate(45deg); background: var(--surface); }
.leaflet-popup-close-button { position: absolute; top: 0; right: 0; border: none; text-align: center; width: 24px; height: 24px; font: 16px/24px var(--body); color: var(--muted); text-decoration: none; background: transparent; }
.leaflet-tooltip { position: absolute; padding: 3px 7px; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; white-space: nowrap; pointer-events: none; font-size: 12px; box-shadow: 0 1px 4px rgb(0 0 0 / .2); }
.leaflet-tooltip-top { margin-top: -8px; } .leaflet-tooltip-bottom { margin-top: 8px; } .leaflet-tooltip-left { margin-left: -8px; } .leaflet-tooltip-right { margin-left: 8px; }

/* transportadores */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.ccard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 10px; align-content: start; }
.ccard.off { opacity: .6; }
.ccard .head { display: flex; gap: 12px; align-items: center; }
.avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; flex: none; border: 3px solid var(--mint); background: var(--navy); color: #fff; display: grid; place-items: center; font: 800 1.15rem var(--display); }
.avatar.sm { width: 34px; height: 34px; font-size: .8rem; border-width: 2px; }
.avatar.lg { width: 84px; height: 84px; font-size: 1.6rem; }
.ccard h4 { font-size: 1.05rem; }
.cap { height: 8px; border-radius: 99px; background: var(--sunken); overflow: hidden; }
.cap span { display: block; height: 100%; background: var(--mint); }
.cap span.over { background: var(--danger); }
.cap span.near { background: var(--amber); }

/* tablas */
.tablewrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.t th, table.t td { padding: 9px 14px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
table.t th { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
table.t td.r, table.t th.r { text-align: right; font-variant-numeric: tabular-nums; }
table.t tfoot td { font-weight: 700; border-bottom: 0; }
table.t tbody tr:hover { background: var(--sunken); }
.perm-table td:first-child { white-space: normal; }

/* rutas */
.stops { list-style: none; margin: 0; padding: 0; counter-reset: s; }

  { url: `https://{s}.basemaps.cartocdn.com/${isDark() ? 'dark_all' : 'rastertiles/voyager'}/{z}/{x}/{y}{r}.png`, opts: { subdomains: 'abcd', maxZoom: 20, attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · © <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>' } },
  { url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', opts: { maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>' } },
];
function addStreets(m, i = 0) {
  const src = TILE_SOURCES()[i];
  if (!src) {
    const n = document.createElement('div'); n.className = 'map-off';
    n.textContent = 'No se pudieron cargar las calles (sin internet o el visor bloquea imágenes externas). Las zonas, rutas y pedidos sí se muestran.';
    m.getContainer().appendChild(n); return;
  }
  let loaded = 0, failed = 0;
  const layer = L.tileLayer(src.url, src.opts).addTo(m);
  layer.on('tileload', () => loaded++);
  layer.on('tileerror', () => { if (++failed >= 4 && loaded === 0) { layer.off(); m.removeLayer(layer); addStreets(m, i + 1); } });
}

function lmap(id, { center = CENTER, zoom = 12, sketch = true, labels = true } = {}) {
  const el = document.getElementById(id);
  if (!el) return null;
  if (!window.L) { el.innerHTML = '<p class="empty">El mapa necesita conexión a internet (Leaflet + OpenStreetMap).</p>'; return null; }
  const m = L.map(el, { scrollWheelZoom: false }).setView(center, zoom);
  addStreets(m);
  if (sketch) {
    // Trazo de referencia del río y barrios: se ve aunque no carguen las teselas.
    L.polyline([[6.140, -75.610], [6.170, -75.600], [6.195, -75.588], [6.215, -75.579], [6.240, -75.574], [6.265, -75.569], [6.290, -75.562]], { className: 'river', weight: 5, opacity: .8, interactive: false }).addTo(m);
    if (labels) Object.entries(BARRIOS).filter(([k]) => !k.includes('(')).forEach(([k, p]) => L.marker(p, { interactive: false, icon: L.divIcon({ className: 'pin-icon', html: `<span class="blabel">${k}</span>`, iconSize: [0, 0], iconAnchor: [-8, 14] }) }).addTo(m));
  }
  MAPS.push(m); return m;
}
const icon = (html, size = 26) => L.divIcon({ className: 'pin-icon', html, iconSize: [size, size], iconAnchor: [size / 2, size / 2], popupAnchor: [0, -size / 2] });
const statusIcon = (o, sel) => icon(`<span class="mk dot${o.status === 'incident' || o.status === 'in_route' ? ' dark' : ''}" style="--c: var(--s-${o.status});${sel ? 'transform:scale(1.35)' : ''}"></span>`, 18);
const lastLoc = carrierId => { const os = S.orders.filter(o => o.carrierId === carrierId && o.status === 'in_route'); const h = os.flatMap(o => o.history.filter(h => h.loc && h.status === 'in_route')).sort((a, b) => b.at - a.at)[0]; return h?.loc || null; };
function drawZones(m, { faint = false, labels = true } = {}) {
  S.zones.forEach(z => {
    const p = L.polygon(z.poly, { color: z.color, weight: faint ? 1 : 2, fillOpacity: z.active ? (faint ? .06 : .16) : .03, dashArray: z.active ? null : '4 4', interactive: !faint }).addTo(m);
    if (labels) L.marker(centroid(z.poly), { interactive: false, icon: L.divIcon({ className: 'pin-icon', html: `<div class="zlabel">${esc(z.name)}<br><span class="fee">${money(z.fee)}</span></div>`, iconSize: [0, 0], iconAnchor: [0, 10] }) }).addTo(m);
    p.zone = z;
  });
}
function drawRoute(m, r, { fit = true } = {}) {
  const pts = [r.start, ...r.stops.map(id => order(id).address.loc)];
  L.polyline(pts, { className: 'route-line', weight: 4, opacity: .9, dashArray: r.status === 'planned' ? '8 6' : null }).addTo(m);
  L.marker(r.start, { icon: icon('<span class="mk depot">B</span>') }).addTo(m).bindTooltip('Bodega (punto de partida)');
  r.stops.forEach((id, i) => {
    const o = order(id), done = o.status === 'delivered';
    L.marker(o.address.loc, { icon: icon(`<span class="mk${o.status === 'incident' ? ' dark' : ''}" style="--c:${done ? 'var(--s-delivered)' : o.status === 'incident' ? 'var(--amber)' : 'var(--navy)'}">${i + 1}</span>`) })
      .addTo(m).bindPopup(`<b>${i + 1}. ${esc(o.recipient.name)}</b><br>${esc(o.address.line)}<br>${esc(o.address.barrio)} · ${STATUS[o.status]}${o.cod ? `<br>Cobrar <b>${money(o.cod)}</b>` : ''}`);
  });
  const loc = lastLoc(r.carrierId);
  if (loc && r.status === 'in_progress') L.marker(loc, { icon: icon(`<span class="mk rider">${initials(carrierById(r.carrierId).name)}</span>`, 30) }).addTo(m).bindTooltip(carrierById(r.carrierId).name);
  if (fit) m.fitBounds(pts, { padding: [36, 36], maxZoom: 15 });
}

/* ---------- reportes ---------- */
function report(f) {
  const inRange = d => { const k = dayOf(d); return k >= f.from && k <= f.to; };
  const okC = o => !f.carrier || o.carrierId === f.carrier, okZ = o => !f.zone || o.zoneId === f.zone;
  const orders = S.orders.filter(o => inRange(o.created) && okC(o) && okZ(o));
  const pays = S.orders.filter(o => o.delivery && inRange(o.delivery.at) && okC(o) && okZ(o)).flatMap(o => o.delivery.payments.map(p => ({ ...p, carrierId: o.carrierId, day: dayOf(o.delivery.at) })));
  const incs = S.orders.filter(o => okC(o) && okZ(o)).flatMap(o => o.history.filter(h => h.status === 'incident' && inRange(h.at)).map(h => ({ reason: h.reason || 'other', carrierId: o.carrierId })));
  const by = (arr, k) => arr.reduce((a, x) => (a[k(x)] = (a[k(x)] || 0) + 1, a), {});
  const st = by(orders, o => o.status), delivered = st.delivered || 0, closed = delivered + (st.returned || 0);
  const promised = orders.filter(o => o.delivery && o.promised), onTime = promised.filter(o => o.delivery.at <= o.promised).length;
  const days = []; for (let d = f.from; d <= f.to; d = addDays(d, 1)) days.push({ date: d, created: 0, delivered: 0, fees: 0, collected: 0 });
  const D = Object.fromEntries(days.map(d => [d.date, d]));
  orders.forEach(o => { const d = D[dayOf(o.created)]; if (d) { d.created++; d.fees += o.fee || 0; } if (o.delivery && D[dayOf(o.delivery.at)]) D[dayOf(o.delivery.at)].delivered++; });
  pays.forEach(p => { if (D[p.day]) D[p.day].collected += p.amount; });
  const carriers = {}; const cr = id => (carriers[id || 'none'] ??= { name: id ? carrierById(id)?.name : 'Sin asignar', orders: 0, delivered: 0, returned: 0, incidents: 0, fees: 0, collected: 0 });
  orders.forEach(o => { const c = cr(o.carrierId); c.orders++; c.delivered += o.status === 'delivered'; c.returned += o.status === 'returned'; c.fees += o.fee || 0; });
  incs.forEach(i => cr(i.carrierId).incidents++); pays.forEach(p => cr(p.carrierId).collected += p.amount);
  const zones = {}; orders.forEach(o => { const z = (zones[o.zoneId || 'none'] ??= { name: o.zoneId ? zoneById(o.zoneId)?.name : 'Fuera de zona', color: o.zoneId ? zoneById(o.zoneId)?.color : '#94a3b8', orders: 0, delivered: 0, fees: 0 }); z.orders++; z.delivered += o.status === 'delivered'; z.fees += o.fee || 0; });
  const methods = {}; pays.forEach(p => methods[p.method] = (methods[p.method] || 0) + p.amount);
  return {
    orders, days, totals: { orders: orders.length, delivered, returned: st.returned || 0, incidents: incs.length, rate: closed ? delivered * 100 / closed : null, onTime: promised.length ? onTime * 100 / promised.length : null, fees: orders.reduce((a, o) => a + (o.fee || 0), 0), collected: pays.reduce((a, p) => a + p.amount, 0), cash: pays.filter(p => p.method === 'cash').reduce((a, p) => a + p.amount, 0) },
    carriers: Object.values(carriers).sort((a, b) => b.delivered - a.delivered), zones: Object.values(zones).sort((a, b) => b.orders - a.orders), methods, reasons: by(incs, i => i.reason),
  };
}
function chartSvg(days) {
  const W = 680, H = 210, L0 = 34, B = 26, T = 10, max = Math.max(4, ...days.map(d => Math.max(d.created, d.delivered)));
  const step = max <= 8 ? 2 : max <= 20 ? 5 : 10, top = Math.ceil(max / step) * step;
  const y = v => H - B - (v / top) * (H - B - T), bw = (W - L0 - 8) / days.length, every = Math.ceil(days.length / 10);
  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line class="gl" x1="${L0}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L0 - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`;
  days.forEach((d, i) => {
    const x = L0 + i * bw + bw * .12, w = Math.max(2, bw * .36);
    g += `<rect class="b1" x="${x}" y="${y(d.created)}" width="${w}" height="${H - B - y(d.created)}" rx="2"><title>${d.date}: ${d.created} creados</title></rect>`;
    g += `<rect class="b2" x="${x + w + 1}" y="${y(d.delivered)}" width="${w}" height="${H - B - y(d.delivered)}" rx="2"><title>${d.date}: ${d.delivered} entregados</title></rect>`;
    if (i % every === 0) g += `<text class="ax" x="${x + w}" y="${H - 8}" text-anchor="middle">${d.date.slice(8)}/${d.date.slice(5, 7)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pedidos creados y entregados por día">${g}</svg>`;
}
function csvOf(rep) {

function bindSignature() {

  let drawing = false; const pos = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  cv.addEventListener('pointerdown', e => { drawing = true; cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...pos(e)); });

  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
}

        <section class="card"><span class="mono small muted">PEDIDO ${o.code}</span><span class="hello">Hola ${esc(first(o.recipient.name))} 👋</span>
          <span class="status" style="--c: var(--s-${o.status})">${STATUS[o.status]}</span>
          ${['incident', 'returned'].includes(o.status) ? '' : `<div class="progress" aria-hidden="true">${steps.map(s => `<span class="${reached.has(s) ? 'on' : ''}"></span>`).join('')}</div><div class="progress-l" aria-hidden="true"><span>Recibido</span><span>Asignado</span><span>En camino</span><span>Entregado</span></div>`}
          ${etaLine ? `<div class="eta">${etaLine}</div>` : ''}
          ${o.status === 'incident' ? `<div class="alert">Tuvimos una novedad: ${REASONS[o.history.at(-1).reason] || 'novedad en la entrega'}. Te contactaremos para coordinar.</div>` : ''}
        </section>
        ${inRoute && c ? `<section class="card"><div class="rider">${avatarHtml(c, 'lg')}<div><span class="small muted">Te lo lleva</span><br><b style="font-size:1.1rem">${esc(first(c.name))}</b> · ${VEHICLES[c.vehicle] || ''}<br>${c.plate ? `<span class="plate">${c.plate}</span>` : ''}</div></div>
          <div class="map short" id="m-client"></div><span class="small muted">Ubicación aproximada del mensajero (≈110 m) y tu barrio.</span></section>` : ''}
        <section class="card"><dl class="kv">
          <dt>Destino</dt><dd>${esc(o.address.barrio)}, ${esc(o.address.city)}</dd><dt>Paquetes</dt><dd>${o.packages.length}</dd>
          ${z ? `<dt>Zona</dt><dd>${esc(z.name)}</dd>` : ''}${o.fee != null ? `<dt>Domicilio</dt><dd><span class="fee">${money(o.fee)}</span></dd>` : ''}
          ${o.promised ? `<dt>Entrega estimada</dt><dd>Hoy antes de las ${hm(o.promised)}</dd>` : ''}
          ${o.delivery ? `<dt>Recibido por</dt><dd>${esc(first(o.delivery.receiver))}</dd>` : ''}</dl></section>
        <section class="card"><ol class="timeline">${[...o.history].reverse().map(h => `<li style="--c: var(--s-${h.status})"><strong>${STATUS[h.status]}</strong>${h.reason ? REASONS[h.reason] + '<br>' : ''}<small>${fmt(h.at)}</small></li>`).join('')}</ol></section>
        <p class="small muted" style="text-align:center;margin:0">Rastreo por ISA Track · Tus datos están protegidos</p>
      </div>
    </div>
    <div class="stack">
      <div class="panel pad stack"><label class="f">Pedido a rastrear<select id="t-code">${S.orders.filter(x => dayOf(x.created) === today() || !['delivered', 'returned'].includes(x.status)).map(x => `<option value="${x.code}" ${x.code === o.code ? 'selected' : ''}>${x.code} · ${esc(x.recipient.name)} · ${STATUS[x.status]}</option>`).join('')}</select></label></div>
      <div class="panel"><header><h3>Cotiza tu domicilio</h3><span class="small muted">Lo que ve el cliente antes de pedir</span></header>
        <div class="fgrid"><label class="f full">Tu barrio<select id="cq-barrio"><option value="">Elige o haz clic en el mapa…</option>${Object.keys(BARRIOS).map(b => `<option ${cq?.barrio === b ? 'selected' : ''}>${b}</option>`).join('')}</select></label>
          ${cq ? `<div class="full">${cq.zone ? `<div class="eta">Domicilio a ${esc(cq.zone.name)}: <span class="fee" style="font-size:1rem">${money(cq.zone.fee)}</span> · llega en ≈ ${cq.zone.minutes} min</div>` : '<div class="alert">Aún no llegamos a ese punto.</div>'}</div>` : ''}</div>
        <div class="map short" id="m-quote" style="border-radius:0 0 var(--radius) var(--radius)"></div></div>
      <div class="panel"><header><h3>Mensajes al cliente</h3><span class="muted small">Simulado · luego WhatsApp</span></header>
        <div class="pad"><ul class="msgs">${S.messages.slice(0, 6).map(m => `<li class="msg">${esc(m.text)}<small class="num">${esc(m.to)} · ${fmt(m.at)}</small></li>`).join('') || '<li class="empty">Aún no hay mensajes.</li>'}</ul></div></div>
    </div>
  </div>`;
  return () => {
    if (inRoute && c) {
      const m = lmap('m-client', { sketch: false });
      if (m) {
        const dest = [+o.address.loc[0].toFixed(2), +o.address.loc[1].toFixed(2)];
        L.circle(dest, { radius: 600, color: '#0B1F3A', weight: 2, fillOpacity: .08 }).addTo(m).bindTooltip('Tu barrio');
        if (approx) { L.marker(approx, { icon: icon(`<span class="mk rider">${initials(c.name)}</span>`, 30) }).addTo(m).bindTooltip(first(c.name), { permanent: true, direction: 'top', offset: [0, -14] }); m.fitBounds([dest, approx], { padding: [40, 40], maxZoom: 15 }); } else m.setView(dest, 14);
      }
    }
    const mq = lmap('m-quote', { zoom: 11 });
    if (mq) { drawZones(mq, { faint: false, labels: false }); if (cq) L.marker(cq.pt, { icon: icon('<span class="mk dot dark" style="--c:var(--amber)"></span>', 18) }).addTo(mq); mq.on('click', e => { const pt = [e.latlng.lat, e.latlng.lng]; S.clientQuote = { pt, zone: zoneFor(pt), barrio: '' }; render(); }); }
  };
}

/* ------------------------------ eventos ------------------------------ */
const side = document.getElementById('side'), scrim = document.getElementById('scrim'), menuBtn = document.getElementById('menu-btn');
const closeMenu = () => { side.classList.remove('open'); scrim.classList.remove('open'); menuBtn.setAttribute('aria-expanded', 'false'); };
menuBtn.addEventListener('click', () => { const o = !side.classList.contains('open'); side.classList.toggle('open', o); scrim.classList.toggle('open', o); menuBtn.setAttribute('aria-expanded', String(o)); });
scrim.addEventListener('click', closeMenu);
function go(v) { S.view = v; closeMenu(); render(); window.scrollTo({ top: 0 }); }
document.getElementById('nav').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) go(b.dataset.view); });
document.getElementById('acting').addEventListener('change', e => { S.acting = e.target.value; S.driver = { screen: 'list', orderId: null }; DF = null; render(); toast(`Ahora ves el sistema como ${user().name} (${ROLE_LABELS[user().role]}).`); });
document.getElementById('reset').addEventListener('click', () => { seed(); DF = null; render(); toast('Demo reiniciada con los datos de ejemplo.'); });

$app.addEventListener('click', e => {
  const t = e.target, pick = sel => t.closest(sel); let el;
  if ((el = pick('[data-view]'))) return go(el.dataset.view);
  if ((el = pick('[data-goto-order]'))) { S.selected = el.dataset.gotoOrder; S.filter = null; return go('desk'); }
  if ((el = pick('[data-goto-route]'))) { S.routeSel = el.dataset.gotoRoute; return go('routes'); }
  // pedidos
  if ((el = pick('[data-filter]'))) { S.filter = el.dataset.filter || null; return render(); }
  if ((el = pick('.row[data-id]'))) { S.selected = el.dataset.id; return render(); }
  if (pick('#toggle-new')) { S.form = !S.form; return render(); }
  if ((el = pick('[data-act]'))) {
    const o = order(S.selected) || null;
    if (el.dataset.act === 'assign') return attempt(() => { guard('orders.assign'); assignCarrier(o, document.getElementById('assign-to').value, actor()); }, 'Pedido asignado.');
    if (el.dataset.act === 'status') return attempt(() => { guard('orders.change_status'); changeStatus(o, el.dataset.to, { by: actor() }); }, 'Estado actualizado.');
    if (el.dataset.act === 'see-track') { S.trackCode = o.code; return go('client'); }
  }
  // rutas
  if ((el = pick('[data-route]'))) { S.routeSel = el.dataset.route; return render(); }
  if (pick('#rt-plan')) {
    return attempt(() => { const r = planRoute({ carrierId: S.planCarrier, date: S.routeDate, orderIds: S.planPick, name: document.getElementById('rt-name').value, optimize: S.planOptimize, by: actor() }); S.routeSel = r.id; S.planPick = []; }, 'Ruta programada y pedidos asignados al mensajero.');
  }
  if ((el = pick('[data-up]')) || (el = pick('[data-down]'))) {
    const r = S.routes.find(x => x.id === S.routeSel) || S.routes.find(x => x.date === S.routeDate), i = Number(el.dataset.up ?? el.dataset.down), j = el.dataset.up !== undefined ? i - 1 : i + 1;
    [r.stops[i], r.stops[j]] = [r.stops[j], r.stops[i]]; return render();
  }
  if ((el = pick('[data-ract]'))) {
    const r = S.routes.find(x => x.id === S.routeSel) || S.routes.find(x => x.date === S.routeDate), a = el.dataset.ract;
    if (a === 'optimize') { const before = routeKm(r); r.stops = optimize(r.start, r.stops); return attempt(() => {}, `Orden optimizado: ${before.toFixed(1)} → ${routeKm(r).toFixed(1)} km.`); }
    return attempt(() => changeRouteStatus(r, { start: 'in_progress', complete: 'completed', cancel: 'cancelled' }[a]), { start: 'Ruta iniciada.', complete: 'Ruta completada.', cancel: 'Ruta cancelada. Los pedidos quedan asignados y se pueden programar en otra ruta.' }[a]);
  }
  // transportadores
  if (pick('#cr-new')) { S.carrierEdit = blankCarrier(); return render(); }
  if (pick('#cr-cancel')) { S.carrierEdit = null; return render(); }
  if ((el = pick('[data-cedit]'))) { const c = carrierById(el.dataset.cedit); S.carrierEdit = { ...c, capKg: c.capKg ?? '', capPkgs: c.capPkgs ?? '' }; render(); return window.scrollTo({ top: 0, behavior: 'smooth' }); }
  if ((el = pick('[data-ctoggle]'))) { const c = carrierById(el.dataset.ctoggle); return attempt(() => { guard('carriers.update'); c.active = !c.active; }, c.active ? 'Transportador activado.' : 'Transportador desactivado: ya no se le pueden asignar pedidos.'); }
  if (pick('#cr-photo-demo')) { readCarrierForm(); S.carrierEdit.photo = avatarPhoto(S.carrierEdit.name); return render(); }
  if (pick('#cr-photo-del')) { readCarrierForm(); S.carrierEdit.photo = null; return render(); }
  // zonas
  if (pick('#zd-start')) { S.drawing = { name: '', color: '#00C896', fee: '9000', minutes: '45', poly: [] }; S.quote = null; return render(); }
  if (pick('#zd-cancel')) { S.drawing = null; return render(); }
  if (pick('#zd-undo')) { readZoneDraft(); S.drawing.poly.pop(); return render(); }
  if (pick('#zd-save')) {
    readZoneDraft(); const d = S.drawing;
    return attempt(() => {
      guard('zones.manage');
      if (!d.name.trim()) throw new BusinessError('invalid_argument', 'La zona necesita un nombre.');
      if (S.zones.some(z => z.name.toLowerCase() === d.name.trim().toLowerCase())) throw new BusinessError('duplicate_zone_name', `Ya existe una zona llamada "${d.name.trim()}".`);
      const fee = Number(String(d.fee).replace(/\D/g, '')); if (!Number.isInteger(fee) || String(d.fee).trim() === '') throw new BusinessError('invalid_argument', 'Escribe la tarifa en pesos, sin puntos.');
      if (d.poly.length < 3 || area(d.poly) <= 0) throw new BusinessError('invalid_argument', 'Una zona necesita al menos 3 puntos en el mapa.');
      S.zones.push({ id: uid('z'), name: d.name.trim(), color: d.color.toUpperCase(), fee, minutes: Number(d.minutes) || null, active: true, poly: d.poly }); S.drawing = null;
    }, 'Zona creada. Los pedidos nuevos en esa área toman su tarifa.');
  }
  if ((el = pick('[data-ztoggle]'))) { const z = zoneById(el.dataset.ztoggle); return attempt(() => { guard('zones.manage'); z.active = !z.active; }, z.active ? 'Zona activada.' : 'Zona pausada: no cotiza nuevos pedidos.'); }
  if ((el = pick('[data-zdel]'))) { S.confirmDel = el.dataset.zdel; return render(); }
  if ((el = pick('[data-zdel-yes]'))) { return attempt(() => { guard('zones.manage'); S.zones = S.zones.filter(z => z.id !== el.dataset.zdelYes); S.orders.forEach(o => { if (o.zoneId === el.dataset.zdelYes) o.zoneId = null; }); S.confirmDel = null; }, 'Zona eliminada. Los pedidos conservan la tarifa que ya tenían.'); }
  if (pick('#z-savefees')) {
    return attempt(() => { guard('zones.manage'); document.querySelectorAll('[data-zfee]').forEach(i => { const v = i.value.replace(/\D/g, ''); if (v === '') throw new BusinessError('invalid_argument', 'Todas las zonas necesitan una tarifa.'); zoneById(i.dataset.zfee).fee = Number(v); }); }, 'Tarifas guardadas.');
  }
  // reportes
  if ((el = pick('[data-preset]'))) { const [a, b] = el.dataset.preset.split('|'); Object.assign(S.report, { from: a, to: b }); return render(); }
  if (pick('#rp-csv')) {
    const blob = new Blob(['﻿' + csvOf(report(S.report))], { type: 'text/csv;charset=utf-8' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `pedidos_${S.report.from}_${S.report.to}.csv`; document.body.appendChild(a); a.click(); a.remove();
    return toast('Si la descarga no arranca (vista previa con restricciones), usa "Copiar CSV" y pégalo en Excel.');
  }
  if (pick('#rp-copy')) { const text = csvOf(report(S.report)); navigator.clipboard?.writeText(text).then(() => toast('CSV copiado. Pégalo en Excel o Google Sheets.'), () => toast('No se pudo copiar automáticamente en este navegador.', true)); return; }
  // usuarios
  if (pick('#us-new')) { S.userEdit = { id: null, name: '', email: '', role: 'dispatcher', carrierId: null, extra: [], revoked: [], active: true }; return render(); }
  if ((el = pick('[data-uedit]'))) { const u = S.users.find(x => x.id === el.dataset.uedit); S.userEdit = { ...u, extra: [...u.extra], revoked: [...u.revoked] }; return render(); }
  if ((el = pick('[data-act-as]'))) { S.acting = el.dataset.actAs; render(); return toast(`Ahora ves el sistema como ${user().name}. Mira el menú.`); }
  if (pick('#ue-reset')) { readUserForm(); S.userEdit.extra = []; S.userEdit.revoked = []; return render(); }
  if (pick('#ue-save')) {
    readUserForm(); const e2 = S.userEdit;
    return attempt(() => {
      guard('users.manage');
      if (!e2.name.trim() || !/^\S+@\S+\.\S+$/.test(e2.email)) throw new BusinessError('validation', 'Escribe el nombre y un correo válido.');
      if (S.users.some(u => u.email.toLowerCase() === e2.email.toLowerCase() && u.id !== e2.id)) throw new BusinessError('validation', 'Ese correo ya tiene usuario.');
      if (e2.role === 'driver' && !e2.carrierId) throw new BusinessError('validation', 'Un usuario mensajero debe estar vinculado a un transportador.');
      if (e2.id === S.acting && !e2.active) throw new BusinessError('validation', 'No puedes desactivar tu propio usuario.');
      if (e2.role !== 'driver') e2.carrierId = null;
      if (e2.id) Object.assign(S.users.find(u => u.id === e2.id), e2); else { e2.id = uid('u'); S.users.push({ ...e2 }); }
      if (!allows(user(), 'users.manage')) S.userEdit = null;
    }, 'Usuario guardado. Los permisos aplican de inmediato.');
  }
  // mensajero
  if ((el = pick('[data-open]'))) { S.driver = { screen: 'order', orderId: el.dataset.open }; return render(); }
  if (pick('[data-back]')) { S.driver = { screen: 'list', orderId: null }; return render(); }
  if (pick('[data-back-order]')) { S.driver.screen = 'order'; return render(); }
  if (pick('#dr-photo-demo')) { const c = driverCarrier(); c.photo = avatarPhoto(c.name); render(); return toast('Foto actualizada. El cliente la verá en el rastreo.'); }
  if ((el = pick('[data-dact]'))) {
    const o = order(S.driver.orderId), by = first(driverCarrier().name) + ' (mensajero)', a = el.dataset.dact;
    if (a === 'start-route') { const r = S.routes.find(r => r.carrierId === driverCarrier().id && r.date === today() && r.status === 'planned'); return attempt(() => { guard('routes.drive'); changeRouteStatus(r, 'in_progress'); }, 'Ruta iniciada. Sal hacia la primera parada.'); }
    if (a === 'route') return attempt(() => { guard('orders.change_status'); changeStatus(o, 'in_route', { by, loc: [o.address.loc[0] + 0.006, o.address.loc[1] - 0.004] }); }, 'Vas en camino. El cliente recibió el link por WhatsApp.');
    if (a === 'deliver') { S.driver.screen = 'deliver'; return render(); }
    if (a === 'incident') { S.driver.screen = 'incident'; return render(); }
  }
  if ((el = pick('[data-reason]'))) { const o = order(S.driver.orderId); if (attempt(() => changeStatus(o, 'incident', { by: first(driverCarrier().name) + ' (mensajero)', reason: el.dataset.reason }), 'Novedad registrada.')) { S.driver = { screen: 'list', orderId: null }; render(); } return; }
  if (pick('#d-photo-demo')) { DF.photo = demoPhoto(); return render(); }
  if (pick('#d-sig-clear')) { DF.signature = null; return render(); }
  if (pick('#d-gps')) { const o = order(DF.orderId); DF.loc = [o.address.loc[0] + 0.0003, o.address.loc[1] - 0.0002]; return render(); }
  if (pick('#d-addpay')) { DF.payments.push({ method: 'nequi', amount: '', reference: '' }); return render(); }
  if ((el = pick('[data-pdel]'))) { DF.payments.splice(Number(el.dataset.pdel), 1); return render(); }
  if (pick('#d-submit')) { const o = order(DF.orderId); if (attempt(() => deliver(o, DF, first(driverCarrier().name) + ' (mensajero)'), 'Entrega registrada. El cliente recibió la confirmación.')) { DF = null; S.driver = { screen: 'list', orderId: null }; render(); } return; }
});
function driverCarrier() { const u = user(); return carrierById(u.role === 'driver' ? u.carrierId : S.driverCarrier); }

$app.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'cr-name' && S.carrierEdit) S.carrierEdit.name = t.value;
  if (!DF) return;
  if (t.id === 'd-receiver') DF.receiver = t.value;
  else if (t.id === 'd-doc') DF.document = t.value;
  else if (t.dataset.pa !== undefined) { DF.payments[t.dataset.pa].amount = t.value.replace(/[^\d]/g, ''); updateSum(); }
  else if (t.dataset.pr !== undefined) DF.payments[t.dataset.pr].reference = t.value;
});
function updateSum() { const o = order(DF.orderId), got = DF.payments.reduce((s, p) => s + (Number(p.amount) || 0), 0), el = document.getElementById('d-sum'); if (el) { el.className = 'sum ' + (got === (o.cod || 0) ? 'ok' : 'bad'); el.lastElementChild.textContent = money(got); } }
$app.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'd-photo' && t.files[0]) resizePhoto(t.files[0], url => { DF.photo = url; render(); });
  else if (t.id === 'cr-photo' && t.files[0]) { readCarrierForm(); resizePhoto(t.files[0], url => { S.carrierEdit.photo = url; render(); }); }
  else if (t.id === 'dr-photo' && t.files[0]) resizePhoto(t.files[0], url => { driverCarrier().photo = url; render(); toast('Foto actualizada. El cliente la verá en el rastreo.'); });
  else if (t.dataset.pm !== undefined) { DF.payments[t.dataset.pm].method = t.value; render(); }
  else if (t.id === 't-code') { S.trackCode = t.value; render(); }
  else if (t.id === 'c-carrier') { S.cashCarrier = t.value; render(); }
  else if (t.id === 'no-barrio') updateFeePreview();
  else if (t.id === 'rt-date') { S.routeDate = t.value || today(); S.routeSel = null; render(); }
  else if (t.id === 'rt-carrier') { S.planCarrier = t.value; render(); }
  else if (t.id === 'rt-opt') S.planOptimize = t.checked;
  else if (t.dataset.pick) { t.checked ? S.planPick.push(t.dataset.pick) : (S.planPick = S.planPick.filter(id => id !== t.dataset.pick)); render(); }
  else if (t.id === 'rp-from' || t.id === 'rp-to') { const k = t.id === 'rp-from' ? 'from' : 'to'; if (t.value) S.report[k] = t.value; if (S.report.from > S.report.to) toast('La fecha final no puede ser anterior a la inicial.', true, 'invalid_argument'); else render(); }
  else if (t.id === 'rp-carrier') { S.report.carrier = t.value; render(); }
  else if (t.id === 'rp-zone') { S.report.zone = t.value; render(); }
  else if (t.id === 'ue-role') { readUserForm(); S.userEdit.role = t.value; S.userEdit.revoked = []; render(); }
  else if (t.classList.contains('perm-cb')) {
    readUserForm(); const e2 = S.userEdit, k = t.dataset.perm, fromRole = matches(ROLES[e2.role], k);
    e2.extra = e2.extra.filter(x => x !== k); e2.revoked = e2.revoked.filter(x => x !== k);
    if (t.checked && !fromRole) e2.extra.push(k); if (!t.checked && fromRole) e2.revoked.push(k); render();
  }
  else if (t.id === 'dr-carrier') { S.driverCarrier = t.value; S.driver = { screen: 'list', orderId: null }; render(); }
  else if (t.id === 'cq-barrio') { S.clientQuote = t.value ? { pt: BARRIOS[t.value], zone: zoneFor(BARRIOS[t.value]), barrio: t.value } : null; render(); }
});
$app.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'new-order') {
    const v = id => document.getElementById(id).value.trim();
    const pk = v('no-pkgs').split('\n').map(s => s.trim()).filter(Boolean).map(l => { const [desc, kg] = l.split(','); return { desc: desc.trim(), kg: Number((kg || '0').trim()) || 0 }; });
    attempt(() => {
      guard('orders.create');
      if (!v('no-name') || !v('no-line')) throw new BusinessError('validation', 'El nombre y la dirección son obligatorios.');
      if (!pk.length) throw new BusinessError('order_requires_packages', 'El pedido debe tener al menos un paquete.');
      if (!/^\+?[0-9 ]{7,20}$/.test(v('no-phone'))) throw new BusinessError('invalid_argument', 'El teléfono del destinatario no es válido.');
      const codRaw = v('no-cod').replace(/[^\d]/g, ''), code = newCode(), b = v('no-barrio'), base = BARRIOS[b];
      const o = mkOrder(code, v('no-name'), v('no-phone'), v('no-line'), b.replace(' (fuera)', ''), [base[0] + (Math.random() - .5) * .004, base[1] + (Math.random() - .5) * .004], codRaw ? Number(codRaw) : null, pk, new Date());
      o.promised = at(today(), 18); o.history[0].by = actor();
      S.orders.push(o); S.selected = o.id; S.form = false; S.filter = null; notify(o);
    }, 'Pedido creado. Se avisó al cliente por WhatsApp.');
  }
  if (e.target.id === 'close-form') { const raw = document.getElementById('c-received').value.replace(/[.\s$]/g, ''); attempt(() => closeCash(S.cashCarrier, raw === '' ? NaN : Number(raw), document.getElementById('c-notes').value), 'Caja cerrada.'); }
  if (e.target.id === 'carrier-form') { readCarrierForm(); attempt(() => { const c = saveCarrier(S.carrierEdit); S.carrierEdit = null; return c; }, 'Transportador guardado.'); }
});

seed();
render();
</script>
